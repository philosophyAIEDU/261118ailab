# 미리보기(시험판) 게시: v*-preview* 태그를 올리면 Windows·macOS 설치 파일을 빌드해 GitHub Releases에 "시험판"으로 공개한다.
# - 업데이트 서명 키 없이 만드는 판이므로 앱 내부 자동 업데이트 대상이 아니다 (서명 키 설정 후 release.yml로 정식 배포).
# - 코드 서명·공증 전이므로 설치 시 운영체제 경고가 나타날 수 있다.
name: preview

on:
  push:
    tags: ["v*-preview*"]

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--bundles nsis"
            path: target/release/bundle/nsis/*.exe
          - os: macos-latest
            args: "--target universal-apple-darwin --bundles dmg"
            path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - name: 핵심 로직 테스트
        run: cargo test -p prh-core
      - name: 설치 파일 빌드 (업데이트 서명 없음)
        run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.os }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  publish:
    needs: bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: files }
      - name: 시험판 게시
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          notes="docs/release-notes/$TAG.md"
          [ -f "$notes" ] || { echo "릴리스 노트가 없습니다: $notes"; exit 1; }
          mkdir out
          cp "$(find files -name '*.exe' | head -1)" "out/PhilosophyResearchHub_${VERSION}_x64-setup.exe"
          cp "$(find files -name '*.dmg' | head -1)" "out/PhilosophyResearchHub_${VERSION}_universal.dmg"
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -la out
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --prerelease --verify-tag \
              --title "교수님만의 AI 연구실 $TAG (미리보기 시험판)" --notes-file "$notes"
          fi
