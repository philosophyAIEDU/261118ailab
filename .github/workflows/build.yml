# 검증 빌드 — GitHub 무료 요금제 저장 공간(0.5GB)을 쓰지 않도록 설계
#
# - push·PR: Linux에서 테스트만 한다. 파일(아티팩트)·캐시를 저장하지 않는다.
# - 문서·소개 사이트·실습 자료만 바뀐 커밋은 실행하지 않는다.
# - Windows·macOS 설치 파일 시험 빌드는 Actions 화면에서 직접 실행할 때만(“Run workflow”에서 설치 파일 빌드 체크),
#   결과 파일은 1일만 보관한다. 실제 배포 파일은 release.yml이 GitHub Releases에 올린다 (Releases는 저장 공간 한도에 포함되지 않음).
name: build

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**", "site/**", "tutorial/**", "demo/gen_spec.py", "LICENSE", "netlify.toml"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "site/**", "tutorial/**", "demo/gen_spec.py", "LICENSE", "netlify.toml"]
  workflow_dispatch:
    inputs:
      bundles:
        description: "Windows·macOS 설치 파일도 시험 빌드 (결과 파일 1일 보관)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: 시스템 라이브러리
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - name: 화면 빌드 (타입 검사 포함)
        run: npm run build
      - name: 화면 단위 테스트
        run: npm test
      - name: 핵심 로직 테스트 (한글 PDF·AI 파이프라인·백업 포함)
        run: cargo test -p prh-core
      - name: 앱 계층 테스트
        run: cargo test -p philosophy-research-hub

  bundle:
    if: github.event_name == 'workflow_dispatch' && inputs.bundles
    needs: test-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--bundles nsis"
            path: target/release/bundle/nsis/*.exe
          - os: macos-latest
            args: "--target universal-apple-darwin --bundles dmg"
            path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm ci
      - name: 핵심 로직 테스트 (이 운영체제에서)
        run: cargo test -p prh-core
      - name: 설치 파일 빌드 (서명 없음 · 업데이트 산출물 없음)
        run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 1
