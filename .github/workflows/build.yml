# 검증 빌드: 모든 push·PR에서 테스트하고 Windows·macOS 설치 파일(서명 없음)을 만든다.
name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: 시스템 라이브러리
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - name: 화면 빌드 (타입 검사 포함)
        run: npm run build
      - name: 화면 단위 테스트
        run: npm test
      - name: 핵심 로직 테스트 (한글 PDF·AI 파이프라인·백업 포함)
        run: cargo test -p prh-core
      - name: 앱 계층 테스트
        run: cargo test -p philosophy-research-hub

  bundle:
    needs: test-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--bundles nsis"
            path: target/release/bundle/nsis/*.exe
          - os: macos-latest
            args: "--target universal-apple-darwin --bundles dmg"
            path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - name: 핵심 로직 테스트 (이 운영체제에서)
        run: cargo test -p prh-core
      - name: 설치 파일 빌드 (서명 없음 · 업데이트 산출물 없음)
        run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.path }}
          if-no-files-found: error
